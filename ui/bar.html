<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Transcriptor · grabando</title>
<style>
  :root { --rec: #EF4444; --warning: #F59E0B; --primary: #3B82F6; --success: #22C55E; --text-2: #8B949E; }
  html, body { margin: 0; height: 100%; background: #161B22; color: #E6EDF3; overflow: hidden; user-select: none; }
  body {
    font: 13.5px "Segoe UI Variable Text", "Segoe UI", sans-serif; display: flex; align-items: center;
    padding: 0 8px 0 18px; gap: 4px; box-sizing: border-box; cursor: grab;
  }
  body.dragging { cursor: grabbing; }
  .ic, button { font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; font-style: normal; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--rec); animation: blink 1.6s infinite; flex: none; }
  body.paused .dot { background: var(--warning); animation: none; }
  body.saving .dot { background: var(--primary); animation: none; }
  .time { font: 600 16px "Segoe UI Variable Display", "Segoe UI"; font-variant-numeric: tabular-nums; min-width: 64px; margin: 0 6px 0 10px; }
  button { border: 0; background: transparent; color: inherit; border-radius: 8px; padding: 9px; font-size: 15px; cursor: pointer; line-height: 1; }
  button:hover { background: #21262D; }
  /* Interruptores de audio: clic para silenciar o activar */
  .meter { width: 40px; padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
  .meter .ic { font-size: 16px; }
  .meter .bar { width: 22px; height: 3px; border-radius: 2px; background: #30363D; overflow: hidden; }
  .meter .bar i { display: block; height: 100%; width: 0; background: var(--success); }
  .meter.off { color: var(--text-2); }
  .meter.off::after {  /* tachado diagonal sobre el icono */
    content: ""; position: absolute; top: 5px; left: 50%; width: 2px; height: 20px; margin-left: -1px;
    background: var(--rec); transform: rotate(-45deg); border-radius: 1px;
  }
  .meter.off .bar { visibility: hidden; }
  .sep { width: 1px; height: 24px; background: #3A414B; margin: 0 6px; flex: none; }
  .stop i { display: block; width: 15px; height: 15px; border-radius: 3px; background: #fff; }
  .saving-text { color: var(--text-2); margin-left: 6px; font-family: inherit; }
  body.compact .full, body.saving .controls { display: none !important; }
  body:not(.saving) .saving-text { display: none; }
  .grip { color: #4A525D; font-size: 12px; margin-left: 2px; }
  @keyframes blink { 50% { opacity: .25; } }
</style>
</head>
<body title="Arrastra para mover">
  <span class="dot"></span>
  <span class="time" id="time">00:00</span>
  <button class="meter full" id="mic"><i class="ic">&#xE720;</i><div class="bar"><i></i></div></button>
  <button class="meter full" id="sys"><i class="ic">&#xE767;</i><div class="bar"><i></i></div></button>
  <span class="sep full"></span>
  <span class="controls" style="display:flex; align-items:center; gap:2px">
    <button class="full" id="pause" title="Pausar">&#xE769;</button>
    <button class="stop" id="stop" title="Detener y guardar"><i></i></button>
    <span class="sep full"></span>
    <button id="compact" title="Modo compacto" style="font-size:12px">&#xE921;</button>
    <button class="full" id="cancel" title="Descartar grabación" style="font-size:12px">&#xE711;</button>
  </span>
  <span class="saving-text">Guardando…</span>
  <i class="ic grip" title="Arrastra para mover">&#xE76F;</i>
<script>
  const $ = (s) => document.querySelector(s);
  const fmt = (s) => { s = Math.floor(s); const m = Math.floor(s / 60), h = Math.floor(m / 60), p = (n) => String(n).padStart(2, "0");
                       return h ? `${h}:${p(m % 60)}:${p(s % 60)}` : `${p(m)}:${p(s % 60)}`; };
  const AUDIO = {
    mic: { on: "", label: "Micrófono" },
    sys: { on: "", label: "Audio del sistema" },
  };
  let compact = false;

  /** Estado de cada fuente: encendida/apagada (clic para cambiar). */
  window.setAudio = (a) => {
    for (const key of ["mic", "sys"]) {
      const b = $("#" + key), on = !!a[key];
      b.classList.toggle("off", !on);
      b.title = `${AUDIO[key].label}: ${on ? "activo" : "silenciado"} · clic para ${on ? "silenciar" : "activar"}`;
    }
  };
  window.init = (f) => window.setAudio(f);
  window.update = (ev) => {
    $("#time").textContent = fmt(ev.elapsed);
    $("#mic .bar i").style.width = `${Math.max(0, ev.mic) * 100}%`;
    $("#sys .bar i").style.width = `${Math.max(0, ev.sys) * 100}%`;
  };
  window.setPaused = (p) => {
    document.body.classList.toggle("paused", p);
    $("#pause").textContent = p ? "" : "";
    $("#pause").title = p ? "Reanudar" : "Pausar";
  };
  window.setSaving = () => document.body.classList.add("saving");

  $("#mic").onclick = () => pywebview.api.toggle_audio("mic");
  $("#sys").onclick = () => pywebview.api.toggle_audio("sys");
  $("#pause").onclick = () => pywebview.api.pause();
  $("#stop").onclick = () => pywebview.api.stop();
  $("#cancel").onclick = () => pywebview.api.cancel();
  $("#compact").onclick = () => {
    compact = !compact;
    document.body.classList.toggle("compact", compact);
    $("#compact").textContent = compact ? "" : "";
    $("#compact").title = compact ? "Mostrar todo" : "Modo compacto";
    pywebview.api.compact(compact);
  };
  $(".time").ondblclick = () => pywebview.api.show_app();

  // Arrastrar: desde cualquier parte que no sea un botón. Python mueve la ventana
  // siguiendo al mouse hasta que se suelta el botón (funciona en cualquier monitor).
  document.addEventListener("mousedown", async (e) => {
    if (e.button !== 0 || e.target.closest("button")) return;
    e.preventDefault();
    document.body.classList.add("dragging");
    try { await pywebview.api.begin_drag(); }
    finally { document.body.classList.remove("dragging"); }
  });
</script>
</body>
</html>
