# Revisiones de seguridad automáticas: en cada PR, en cada push a main y una vez por semana
# (para enterarse de vulnerabilidades nuevas aunque el código no cambie).
name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"  # lunes 7:00 a. m. (Colombia)

permissions:
  contents: read

jobs:
  python:
    name: Python · pip-audit + bandit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Vulnerabilidades conocidas en las librerías (pip-audit)
        run: python -m pip_audit -r requirements.txt
      - name: Análisis del código (bandit, severidad media o alta)
        run: python -m bandit -r desktop engine build Transcriptor.pyw -ll

  interfaz:
    name: Interfaz · npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vulnerabilidades en las herramientas de Node
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # publica los hallazgos en la pestaña Security del repositorio
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
