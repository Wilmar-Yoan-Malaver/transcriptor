# Arma los paquetes de una versión desde el código del repositorio (requisito de SignPath:
# los binarios firmados deben salir de una compilación verificable) y, si SignPath está
# configurado, firma el instalador MSI antes de adjuntarlo a la release.
#
# Se ejecuta al subir una etiqueta vX.Y.Z (git push origin v2.3.0): deja la release como BORRADOR,
# para publicarla a mano después de revisarla. También se puede correr a mano desde la pestaña
# Actions para probar el armado: en ese caso solo deja los archivos como artefactos del workflow
# y no toca ninguna release.
#
# Configuración de SignPath (Settings › Secrets and variables › Actions):
#   secreto   SIGNPATH_API_TOKEN
#   variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
# Sin esas variables, el workflow arma todo igual y adjunta el MSI sin firmar.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  # Los PRs que cambian el empaquetado prueban que el armado siga funcionando (sin firmar ni publicar).
  pull_request:
    paths: ["build/**", "installer/**", "requirements.txt", ".github/workflows/release.yml"]

permissions:
  contents: write  # crear la release y adjuntar archivos
  actions: read    # SignPath descarga el artefacto subido por este workflow

jobs:
  build:
    name: Paquetes de Windows
    runs-on: windows-latest
    timeout-minutes: 180  # ~30 min de armado + hasta 1 h esperando la aprobación de la firma
    steps:
      - uses: actions/checkout@v7

      # La misma versión que el Python "embeddable" del paquete (su huella está en build_portable.py).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Versión de la app
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path desktop/app.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con VERSION = $v en desktop/app.py"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      # Entorno limpio: solo las librerías que se distribuyen (sin herramientas de desarrollo).
      - name: Instalar dependencias de la app
        run: python -m pip install -r requirements.txt

      - name: Descargar modelos de Whisper incluidos
        run: |
          python -c "from faster_whisper import download_model; [download_model(n, output_dir=f'dist/_staging/models/{n}') for n in ('tiny', 'base', 'small')]"

      - name: Armar versión portable (.zip)
        run: python build/build_portable.py --zip

      - name: Instalar WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Armar instalador (.msi)
        run: python build/build_installer.py

      - name: Subir MSI sin firmar
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: msi-sin-firmar
          path: dist/Transcriptor-${{ steps.version.outputs.version }}.msi
          if-no-files-found: error

      # Firma con SignPath (solo para etiquetas): cada firma se aprueba a mano en signpath.io (hay 1 h).
      - name: Firmar MSI con SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.ref_type == 'tag' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600  # 1 h para aprobarla en signpath.io
          output-artifact-directory: dist/signed

      - name: Reemplazar el MSI por el firmado y recalcular su huella
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.ref_type == 'tag' }}
        shell: pwsh
        run: |
          $name = "Transcriptor-${{ steps.version.outputs.version }}.msi"
          Copy-Item "dist/signed/$name" "dist/$name" -Force
          $sig = Get-AuthenticodeSignature "dist/$name"
          if ($sig.Status -ne "Valid") { throw "El MSI no quedó firmado: $($sig.Status)" }
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"

      - name: Guardar paquetes como artefactos del workflow
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: paquetes
          path: |
            dist/Transcriptor-*.msi
            dist/Transcriptor-*.msi.sha256
            dist/Transcriptor-portable.zip
            dist/Transcriptor-portable.zip.sha256

      - name: Adjuntar a la release (borrador)
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $tag = "v$v"
          $draft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($draft -eq "false") { throw "La release $tag ya está publicada: no se reemplazan sus archivos." }
          if ($LASTEXITCODE -ne 0 -or -not $draft) {
            gh release create $tag --draft --title "Transcriptor $v" --notes "Borrador armado por GitHub Actions. Completar las notas antes de publicar."
          }
          gh release upload $tag --clobber `
            "dist/Transcriptor-$v.msi" "dist/Transcriptor-$v.msi.sha256" `
            "dist/Transcriptor-portable.zip" "dist/Transcriptor-portable.zip.sha256"
